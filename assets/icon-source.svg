<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background: near-black -->
  <rect width="1024" height="1024" rx="224" fill="#111111"/>

  <!-- Lowercase "j" wordmark in white, drawn with strokes for clean scaling.
       Tittle (the dot) above, stem coming down with a left-curving descender
       hook at the bottom. -->
  <circle cx="540" cy="296" r="58" fill="#FFFFFF"/>
  <path
    d="M540 388 L540 696 Q540 768 468 768 L408 768"
    stroke="#FFFFFF"
    stroke-width="96"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Green accent bar under the wordmark (#2E8B6A) -->
  <rect x="352" y="864" width="320" height="28" rx="14" fill="#2E8B6A"/>
</svg>
